[package]
name = "g3-payments"
version = "0.1.0"

edition = "2024"
description = "Purchases, subscriptions, trials and license keys for G3 apps: one entitlement model over Stripe, the App Store, Google Play and signed licenses."
repository = "https://github.com/g3techhq/g3-payments"
readme = "README.md"
documentation = "https://docs.rs/g3-payments"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "payments", "entitlements", "in-app-purchase", "license"]
categories = ["api-bindings", "authentication", "gui", "wasm", "web-programming"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**"]

[lib]
name = "g3_payments"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }

# apple-jws: certificate chains and ES256 through webpki on ring, which builds
# for the browser and phones as well as the server.
base64 = { version = "0.22.1", optional = true }
rustls-pki-types = { version = "1.14", optional = true }
serde_json = { version = "1.0.140", optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"], optional = true }

# server: provider calls over reqwest, with TLS and every signature on ring,
# so this crate brings no second crypto backend into an app's server build.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"], optional = true }
ring = { version = "0.17.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# stripe: the pause between retries.
tokio = { version = "1.42", default-features = false, features = ["time"], optional = true }

# In the browser, ring's randomness comes from the Web Crypto API through
# getrandom 0.2's `js` feature. Every wasm32 build here runs in a browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
serde_json = "1.0.140"
sha2 = "0.10"
# Signs test payloads the way Apple does, with the same ring webpki verifies on.
ring = "0.17.14"
tokio = { version = "1.42", features = ["macros", "rt"] }

# Every client feature must build for the browser and phones, so nothing a
# server needs may sit outside an optional dependency behind `server` or one
# of its provider features. `just check` builds each feature on its own.
[features]
default = []

# Client and server: checks Apple's signed data (transactions, renewal info,
# server notifications) to Apple Root CA - G3. Pure Rust, so a phone can check
# a StoreKit purchase without a server.
apple-jws = ["dep:base64", "dep:getrandom", "dep:rustls-pki-types", "dep:serde_json", "dep:webpki"]
# Client, iOS and Android: the purchase coordinator over g3-native-plugins'
# StoreKit and Play Billing, pending-receipt checkpoints, and restore.
native = []
# Client, desktop and mobile: the trial clock, the offline license check, and
# license activation.
license = []

# Server: PaymentsService, the Store trait, and the webhook and license routes.
server = ["dep:base64", "dep:reqwest", "dep:ring", "dep:rustls", "dep:serde_json"]
# Stripe Checkout (one-time and subscription), billing portal, webhooks.
stripe = ["server", "dep:tokio"]
# App Store Server API and App Store Server Notifications V2.
app-store = ["server", "apple-jws"]
# Google Play Developer API verification.
play = ["server"]
# Issuing license keys, machine-limited activation, and signing licenses.
license-server = ["server"]
# The Store trait implemented on SurrealDB.
surreal = ["server"]

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
cloned_instead_of_copied = "warn"
allow_attributes_without_reason = "warn"
